# electron-builder configuration for the Block Consult DD desktop app.
# Use `npm run desktop:build` (installers) or `npm run desktop:pack` (unpacked
# app). scripts/build-desktop.mjs prepares .next/standalone and dist-electron/
# first and passes the platform and CPU of the build machine: the Prisma query
# engine in the server matches that machine, so each OS/CPU builds on its own.
appId: com.blockconsult.dd
productName: Block Consult DD
copyright: Copyright © Block Consult GmbH
artifactName: Block-Consult-DD-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# Package the Electron runtime already installed in node_modules instead of
# downloading another copy.
electronDist: node_modules/electron/dist

# app.asar holds only the bundled main process and preload. The Next.js server
# ships unpacked in Resources/server with its own traced node_modules, so the
# project's dependencies stay out of the asar.
asar: true
npmRebuild: false
files:
  - dist-electron/**/*
  - package.json
  - "!**/node_modules/**/*"

extraResources:
  # electron-builder skips a node_modules folder at the root of `from`, so the
  # server's node_modules is copied by the second entry.
  - from: .next/standalone
    to: server
    filter:
      - "**/*"
      - "!node_modules{,/**/*}"
      - "!**/.env*"
      - "!**/*.db"
      - "!**/*.db-journal"
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - "**/*"

# Stored API keys are protected by the app's keychain identity; these fuses stop
# other code from running inside the signed app via ELECTRON_RUN_AS_NODE,
# NODE_OPTIONS or --inspect.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

mac:
  category: public.app-category.business
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Office
  executableName: block-consult-dd
  maintainer: Block Consult GmbH
  synopsis: Due-diligence reports for crypto, token, RWA and stablecoin projects

publish: null
